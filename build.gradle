// Top-level build file where you can add configuration options common to all sub-projects/modules.



buildscript {

    ext{
        kotlin_version = '2.1.21'
        rxjava_version = '1.3.0'
        rxandroid_version = '1.2.1'
        multidex_version = '1.0.3'
        rxfirebase_version = '1.5.0'
        lifecycle_version = '2.7.0'
    }

    repositories {
        google()
        mavenCentral()
        maven { url 'https://jitpack.io' }
        maven {
            url "https://plugins.gradle.org/m2/"
        }

    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.2'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
        // Kotlin 2.x ships the Compose compiler as a Gradle plugin (replaces kotlinCompilerExtensionVersion)
        classpath "org.jetbrains.kotlin:compose-compiler-gradle-plugin:$kotlin_version"
        classpath "org.jlleitschuh.gradle:ktlint-gradle:7.1.0"
        
        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    /*    classpath 'com.google.gms:google-services:3.0.0'*/

        classpath "io.gitlab.arturbosch.detekt:detekt-gradle-plugin:1.18.1"
    }
}

//plugins {
//    id 'com.google.devtools.ksp' version '1.8.10-1.0.9' apply false
//}


allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url 'https://jitpack.io' }
        maven {
            url "https://plugins.gradle.org/m2/"
        }

    }
}


task clean(type: Delete) {
    delete rootProject.buildDir
}

repositories {
    mavenCentral()
}



