name: Android CI

on: 
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Cache Gradle dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-        
  
      - name: Set up JDK
        uses: actions/setup-java@v3
        with:
          java-version: 17
          distribution: temurin

#      - name: code quality with detekt
#        run: ./gradlew detekt

      - name: build app bundle
        run: |
          chmod +x gradlew .github/scripts/build-universal-apk.sh
          ./gradlew :app:bundleDebug

      - name: build universal debug APK
        run: .github/scripts/build-universal-apk.sh debug

      - name: Upload universal debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-universal
          path: app/build/outputs/apk/debug/app-debug-universal.apk
          if-no-files-found: error
          retention-days: 7

#      - name: test
#        run: ./gradlew test
