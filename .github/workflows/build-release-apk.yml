name: Build APK

# Manual only. A tag or GitHub Release trigger is intentionally not enabled.
# Produces one sideloadable universal APK (base + fused dynamic features, including quran_asr).
# The Play bundle uploaded by "Deploy to Play store" is unchanged.
on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug

jobs:
  build:
    name: Build ${{ inputs.build_type }} universal APK
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false

      - name: Decode keystore
        if: inputs.build_type == 'release'
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > release.keystore

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew .github/scripts/build-universal-apk.sh

      - name: Build app bundle
        run: |
          if [ "${{ inputs.build_type }}" = "debug" ]; then
            ./gradlew :app:bundleDebug --no-daemon
          else
            ./gradlew :app:bundleRelease --no-daemon
          fi

      - name: Build signed universal APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: .github/scripts/build-universal-apk.sh "${{ inputs.build_type }}"

      - name: Remove keystore
        if: always() && inputs.build_type == 'release'
        run: rm -f release.keystore

      - name: Upload universal APK
        uses: actions/upload-artifact@v4
        with:
          name: app-${{ inputs.build_type }}-universal
          path: app/build/outputs/apk/${{ inputs.build_type }}/app-${{ inputs.build_type }}-universal.apk
          if-no-files-found: error
          retention-days: 7
