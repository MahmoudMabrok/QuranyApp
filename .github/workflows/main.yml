name: Deploy to Play store

permissions:
  contents: write
  pull-requests: write
  packages: read

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version name (e.g. 1.2.0) — used for Android versionName and iOS MARKETING_VERSION'
        required: true
        default: ''
      track:
        description: 'Google Play track'
        required: true
        type: choice
        default: 'internal'
        options:
          - internal
          - alpha
          - beta
          - production
      submit_for_review:
        description: 'Submit for review (uncheck to upload only)'
        required: false
        type: boolean
        default: true

jobs:

  deploy-android:
    name: Deploy Android → Google Play
    runs-on: ubuntu-latest
    outputs:
      version_code: ${{ steps.set_version.outputs.new_code }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false

      - name: Install Python deps for Play version lookup
        run: pip install --quiet google-auth google-api-python-client

      - name: Get latest versionCode from Google Play
        id: play_version
        env:
          PACKAGE_NAME: education.mahmoud.quranyapp
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          LATEST=$(python .github/scripts/get-play-latest-version-code.py)
          echo "latest play versionCode: $LATEST"
          echo "latest=$LATEST" >> "$GITHUB_OUTPUT"

      - name: Set Play versionName and versionCode
        id: set_version
        env:
          PLAY_LATEST: ${{ steps.play_version.outputs.latest }}
        run: |
          VERSION_NAME="${{ github.event.inputs.version_name }}"
          if [ -z "$VERSION_NAME" ]; then
            echo "version_name is required" >&2
            exit 1
          fi
          # Fetch the latest versionCode published in Play Store and build on top
          # of it (+1) so the upload never collides with an existing code.
          CURRENT_FILE_CODE=$(grep -m 1 -E '^[[:space:]]*versionCode[[:space:]]*=?[[:space:]]*[0-9]+' app/build.gradle | grep -oE '[0-9]+' || true)
          if [ -z "$CURRENT_FILE_CODE" ]; then CURRENT_FILE_CODE=0; fi
          PLAY_LATEST="${PLAY_LATEST:-0}"
          if [ "$PLAY_LATEST" -gt "$CURRENT_FILE_CODE" ]; then
            BASE="$PLAY_LATEST"
          else
            BASE="$CURRENT_FILE_CODE"
          fi
          VERSION_CODE_BASE="$BASE"
          VERSION_CODE_STEP=1
          export VERSION_CODE_BASE VERSION_CODE_STEP
          # Groovy (`versionCode 31`) and Kotlin DSL (`versionCode = 31`).
          source .github/scripts/bump-android-version.sh
          bump_android_version
          echo "versionCode: $CURRENT_CODE (file) -> $PLAY_LATEST (play) -> $NEW_CODE (build)"
          echo "versionName: $VERSION_NAME"
          echo "new_code=$NEW_CODE" >> "$GITHUB_OUTPUT"

          {
            echo "## 📦 Android version dump"
            echo ""
            echo "| Field | Old | New |"
            echo "|-------|-----|-----|"
            echo "| versionCode (file) | \`$CURRENT_CODE\` | \`$NEW_CODE\` |"
            echo "| versionCode (play latest) | — | \`$PLAY_LATEST\` |"
            echo "| versionName | — | \`$VERSION_NAME\` |"
            echo ""
            echo "**Track:** \`${{ github.event.inputs.track }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      # - name: Decode google-services.json
      #   env:
      #     GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
      #   run: printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json


      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > release.keystore

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build release AAB
        run: ./gradlew :app:bundleRelease --no-daemon
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
          KEYSTORE_PATH: ${{ github.workspace }}/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Sign AAB
        run: |
          jarsigner \
            -verbose \
            -sigalg SHA256withRSA \
            -digestalg SHA-256 \
            -keystore release.keystore \
            -storepass "${{ secrets.KEYSTORE_PASSWORD }}" \
            -keypass "${{ secrets.KEY_PASSWORD }}" \
            app/build/outputs/bundle/release/app-release.aab \
            "${{ secrets.KEY_ALIAS }}"


      - name: Upload to Google Play
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: education.mahmoud.quranyapp
          releaseFiles: app/build/outputs/bundle/release/app-release.aab
          track: ${{ github.event.inputs.track }}
          status: ${{ github.event.inputs.submit_for_review == 'true' && 'completed' || 'draft' }}

  commit-version-bump:
    name: Commit version bump
    runs-on: ubuntu-latest
    needs: [deploy-android]
    if: always() && needs.deploy-android.result == 'success'

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Apply version bumps for succeeded jobs
        run: |
          VERSION_NAME="${{ github.event.inputs.version_name }}"

          {
            echo "## 🏷️ Committed version dump"
            echo ""
            echo "**Version name:** \`$VERSION_NAME\`"
            echo ""
            echo "| Platform | Field | Old | New |"
            echo "|----------|-------|-----|-----|"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "${{ needs.deploy-android.result }}" = "success" ]; then
            VERSION_NAME="${{ github.event.inputs.version_name }}"
            # Persist the versionCode actually deployed (play latest + 1).
            DEPLOYED_CODE="${{ needs.deploy-android.outputs.version_code }}"
            if [ -n "$DEPLOYED_CODE" ]; then
              VERSION_CODE_BASE="$DEPLOYED_CODE"
              VERSION_CODE_STEP=0
            else
              VERSION_CODE_STEP=0
            fi
            export VERSION_CODE_BASE VERSION_CODE_STEP
            # shellcheck disable=SC1091
            source .github/scripts/bump-android-version.sh
            bump_android_version
            echo "Android versionCode: $NEW_CODE"
            echo "ANDROID_VERSION_CODE=$NEW_CODE" >> "$GITHUB_ENV"
            echo "| Android | versionCode | \`$CURRENT_CODE\` | \`$NEW_CODE\` |" >> "$GITHUB_STEP_SUMMARY"
            echo "| Android | versionName | — | \`$VERSION_NAME\` |" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Android deploy failed — skipping Android version bump"
            echo "| Android | — | _skipped (deploy failed)_ | |" >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ "${{ needs.deploy-ios.result }}" = "success" ]; then
            PBXPROJ="iosApp/iosApp.xcodeproj/project.pbxproj"
            CURRENT_BUILD=$(grep 'CURRENT_PROJECT_VERSION' "$PBXPROJ" | head -1 | grep -o '[0-9]*')
            NEW_BUILD=$((CURRENT_BUILD + 1))
            sed -i "s/CURRENT_PROJECT_VERSION = $CURRENT_BUILD/CURRENT_PROJECT_VERSION = $NEW_BUILD/g" "$PBXPROJ"
            sed -i "s/MARKETING_VERSION = [^;]*/MARKETING_VERSION = $VERSION_NAME/g" "$PBXPROJ"
            echo "iOS build: $CURRENT_BUILD → $NEW_BUILD"
            echo "| iOS | CURRENT_PROJECT_VERSION | \`$CURRENT_BUILD\` | \`$NEW_BUILD\` |" >> "$GITHUB_STEP_SUMMARY"
            echo "| iOS | MARKETING_VERSION | — | \`$VERSION_NAME\` |" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "iOS deploy failed — skipping iOS version bump"
          fi

          echo "Version name: $VERSION_NAME"

      - name: Commit versionName via force push
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add app/build.gradle
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          name="${{ github.event.inputs.version_name }}"
          git commit -m "chore: set versionName to ${name} [skip version]"
          # Force push the version bump directly to the target branch instead of
          # opening a pull request.
          git push --force origin "HEAD:${{ github.ref_name }}"

      - name: Create GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ github.event.inputs.version_name }}"
          ANDROID="${{ needs.deploy-android.result }}"
          NOTES_FILE="$RUNNER_TEMP/release-notes.md"

          {
            echo "## v${VERSION}"
            echo "- **Version name:** ${VERSION}"
            if [ -n "${ANDROID_VERSION_CODE:-}" ]; then echo "- **Version code:** ${ANDROID_VERSION_CODE}"; fi
            if [ "$ANDROID" = "success" ]; then
              echo "- ✅ Android published to Google Play (${{ github.event.inputs.track }})"
            else
              echo "- ❌ Android deploy failed"
            fi
          } > "$NOTES_FILE"

          # Re-running a version (or deploying the same version from another branch)
          # must not fail the job on "Release.tag_name already exists".
          if gh release view "v${VERSION}" >/dev/null 2>&1; then
            echo "Release v${VERSION} already exists - updating its notes"
            gh release edit "v${VERSION}" --notes-file "$NOTES_FILE"
          else
            gh release create "v${VERSION}" \
              --title "v${VERSION}" \
              --notes-file "$NOTES_FILE" \
              --target "${{ github.ref_name }}"
          fi
